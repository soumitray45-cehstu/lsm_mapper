name: Test and build Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - run: python -m lsm_mapper.selftest

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller packaging/LSM_Mapper.spec --noconfirm --distpath dist --workpath build
      - name: Self-test of the built executable
        run: dist\LSM_Mapper\LSM_Mapper_cli.exe --selftest
      - name: Record environment
        run: pip freeze > dist\LSM_Mapper\build_environment.txt
      - name: Zip
        run: |
          $v = python -c "import lsm_mapper; print(lsm_mapper.__version__)"
          Compress-Archive -Path dist\LSM_Mapper -DestinationPath "LSM_Mapper_v$v`_Windows_x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: LSM_Mapper_Windows_x64
          path: LSM_Mapper_v*_Windows_x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LSM_Mapper_v*_Windows_x64.zip
